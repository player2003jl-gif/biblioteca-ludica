name: BL2 Production Integration Guard
on:
  push:
    branches: [main]
    paths:
      - 'online/**'
      - 'index.html'
      - '.github/workflows/bl2-production-dry-run.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify production clients and root integration
        shell: bash
        run: |
          set -euo pipefail
          node --check online/d1-sync.js
          node --check online/catalog-sync.js
          test "$(wc -c < index.html)" -gt 19000000
          grep -Fq './online/d1-sync.js' index.html
          grep -Fq './online/catalog-sync.js' index.html
          grep -Fq 'async function ensureRemoteFile(book)' index.html
          grep -Fq 'function commitConfirmed()' index.html
          ! grep -Fq 'ADM-003.1 v0.5.19.2 experimental' index.html
      - name: Verify live Cloudflare state
        shell: bash
        run: |
          set -euo pipefail
          base='https://bl2-api.chatgptset26.workers.dev'
          curl -fsS "$base/api/v1/layout" -o /tmp/layout.json
          curl -fsS "$base/api/v1/catalog" -o /tmp/catalog.json
          python3 - <<'PY'
          import json
          L=json.load(open('/tmp/layout.json'));C=json.load(open('/tmp/catalog.json'))
          assert L['revision']>=14
          assert C['revision']>=1 and len(C['catalog']['books'])>=1
          print('PRODUCTION_GUARD_OK layout_r%d catalog_r%d books=%d'%(L['revision'],C['revision'],len(C['catalog']['books'])))
          PY
