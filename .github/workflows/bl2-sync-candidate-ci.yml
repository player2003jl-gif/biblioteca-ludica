name: BL2 Sync Candidate CI
on:
  push:
    branches: [main]
    paths:
      - 'homologacao-sync-integral/**'
      - '.github/workflows/bl2-sync-candidate-ci.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check JavaScript syntax
        run: |
          node --check homologacao-sync-integral/bootstrap.js
          node --check homologacao-sync-integral/d1-sync-completo.js
          node --check homologacao-sync-integral/test-sync.cjs
      - name: Run simulated A/B D1 sync regressions
        run: node homologacao-sync-integral/test-sync.cjs
      - name: Verify production integration remains active
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq './online/d1-sync.js' index.html
          grep -Fq './online/catalog-sync.js' index.html
          ! grep -Fq 'ADM-003.1 v0.5.19.2 experimental' index.html
