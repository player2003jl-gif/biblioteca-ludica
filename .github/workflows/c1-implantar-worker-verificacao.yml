name: C1 - implantar somente Worker de verificacao

on:
  push:
    branches:
      - infra-c1-cloudflare-20261016
    paths:
      - .github/workflows/c1-implantar-worker-verificacao.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bl2-c1-worker-verificacao
  cancel-in-progress: false

jobs:
  worker-verificacao:
    name: Testar e implantar Worker C1 isolado
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/c1-cloudflare/health-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes locais (nao acessam Cloudflare)
        run: node --test test/*.test.mjs
      - name: Conferir segredos sem imprimir valores
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo 'Segredos de implantacao presentes.'
      - name: Implantar exclusivamente bl2-c1-verificacao (sem D1/R2)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.45.0 deploy --config wrangler.jsonc
      - name: Comprovar endpoint publico do Worker no servidor real
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.request

          url = "https://bl2-c1-verificacao.chatgptset26.workers.dev/api/health"
          last = None
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      data = json.load(response)
                      assert response.status == 200
                      assert data.get("status") == "ok"
                      assert data.get("service") == "biblioteca-ludica-c1"
                      assert data.get("database") == "not-configured"
                      assert data.get("storage") == "not-configured"
                      assert data.get("production") is False
                      print("OK: Worker real acessivel via HTTPS e responde corretamente.")
                      break
              except Exception as exc:
                  last = type(exc).__name__
                  if attempt == 11:
                      raise SystemExit("FALHA: Worker nao respondeu corretamente ao teste de rede: " + last)
                  time.sleep(5)
          PY
