name: C1 - implantar somente Worker de verificacao

on:
  push:
    branches:
      - infra-c1-cloudflare-20261016
    paths:
      - .github/workflows/c1-implantar-worker-verificacao.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bl2-c1-worker-verificacao
  cancel-in-progress: false

jobs:
  worker-verificacao:
    name: Testar e implantar Worker C1 isolado
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/c1-cloudflare/health-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes locais (nao acessam Cloudflare)
        run: node --test test/*.test.mjs
      - name: Conferir segredos sem imprimir valores
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          echo 'Segredos de implantacao presentes.'
      - name: Implantar exclusivamente bl2-c1-verificacao (sem D1/R2)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.45.0 deploy --config wrangler.jsonc
      - name: Comprovar resposta HTTPS real com curl
        shell: bash
        run: |
          set -euo pipefail
          url="https://bl2-c1-verificacao.chatgptset26.workers.dev/api/health"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --connect-timeout 6 --max-time 15 -H 'Accept: application/json' "$url" -o "$RUNNER_TEMP/c1-health.json"; then
              python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"c1-health.json").read_text())
          assert d["service"]=="biblioteca-ludica-c1"
          assert d["status"]=="ok"
          assert d["production"] is False
          assert d["database"]=="not-configured"
          assert d["storage"]=="not-configured"
          print("OK: GET HTTPS publico respondeu 200 e conteudo JSON correto.")
          PY
              exit 0
            fi
            sleep 4
          done
          echo 'FALHA: endpoint HTTPS nao respondeu corretamente ao curl.' >&2
          exit 1
