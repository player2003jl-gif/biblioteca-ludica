name: Construir homologacao isolada ADM-004
on:
  push:
    branches: [preview-adm004-isolado]
    paths:
      - '.github/workflows/construir-preview-adm004.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    if: github.ref == 'refs/heads/preview-adm004-isolado'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Gerar preview sem acessar armazenamento de producao
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,hashlib,subprocess
          base=Path('index.html')
          dest=Path('homologacao-adm004/index.html')
          s=base.read_text(encoding='utf-8')
          assert s.startswith('<!DOCTYPE html>')
          assert s.count('BL2_ADM002_BACKUP_')==2
          assert s.count('BL2_ADM002_ASSET_')==2
          assert s.count("'bl2-catalog-v03'")==2
          assert s.count('localStorage')>=40
          s=s.replace('BL2_ADM002_BACKUP_','BL2_ADM004_STAGING_BACKUP_').replace('BL2_ADM002_ASSET_','BL2_ADM004_STAGING_ASSET_')
          s=s.replace("'bl2-catalog-v03'","'bl2-adm004-staging-catalog-v03'")
          s=re.sub(r'\blocalStorage\b','window.__BL2_STAGING_LOCAL__',s)
          shim=r'''<script id="adm004-staging-isolation">
          /* Sandbox de homologação ADM-004: separação de armazenamento em relação à raiz publicada. */
          (()=>{
            'use strict';
            const real = window.localStorage;
            const prefix = '__BL2_ADM004_STAGING_20261016__:';
            const keys = () => {
              const found=[];
              for(let i=0;i<real.length;i++){
                const k=real.key(i);if(k&&k.startsWith(prefix))found.push(k.slice(prefix.length));
              }
              return found;
            };
            const stage = {
              getItem(k){return real.getItem(prefix+String(k));},
              setItem(k,v){return real.setItem(prefix+String(k),String(v));},
              removeItem(k){return real.removeItem(prefix+String(k));},
              clear(){for(const k of keys())real.removeItem(prefix+k);},
              key(i){return keys()[Number(i)]??null;},
              get length(){return keys().length;}
            };
            Object.defineProperty(window,'__BL2_STAGING_LOCAL__',{value:stage,configurable:false,writable:false});
          })();
          </script>
          '''
          assert 'id="adm004-staging-isolation"' not in s
          s=s.replace('</head>',shim+'</head>',1)
          s=s.replace('<title>Biblioteca Lúdica II — Teste 0.5.19 (ADM-003)</title>', '<title>Biblioteca Lúdica II — HOMOLOGAÇÃO ISOLADA ADM-004</title>',1)
          banner='''<div id="adm004-stage-banner" role="status" style="position:fixed;right:12px;bottom:12px;z-index:2147483647;background:#451c16;color:#fff4d1;border:2px solid #e8bb65;border-radius:8px;padding:9px 13px;font:bold 12px/1.4 system-ui;box-shadow:0 3px 15px #000b;pointer-events:none">ADM-004 · TESTE ISOLADO<br>Não é a biblioteca pública</div>'''
          s=s.replace('<body>','<body>'+banner,1)
          assert 'BL2_ADM002_BACKUP_' not in s and 'BL2_ADM002_ASSET_' not in s
          assert 'window.__BL2_STAGING_LOCAL__' in s
          dest.parent.mkdir(exist_ok=True)
          dest.write_text(s,encoding='utf-8')
          b=dest.read_bytes()
          h=hashlib.sha256(b).hexdigest()
          print('preview SHA256',h,'bytes',len(b))
          assert h=='437b148bc65ab1fe27b851a71096c7b640484304ab1ec984b5ab8b664f2b7356'
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()=='0fb166eebe391d4d7a8bce6f9741421a3b123dd5'
          for i,script in enumerate(re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s)):
              p=Path('/tmp/adm004-preview-'+str(i)+'.js')
              p.write_text(script,encoding='utf-8')
              subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Publicar somente na ramificacao experimental
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add homologacao-adm004/index.html
          if ! git diff --staged --quiet; then
            git commit -m "test: gerar pagina isolada de homologacao ADM-004"
            git push origin HEAD:preview-adm004-isolado
          fi
