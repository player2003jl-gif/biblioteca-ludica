name: C1 - verificar R2 sem criar recursos

on:
  push:
    branches: [infra-c1-cloudflare-20261016]
    paths:
      - .github/workflows/c1-verificar-r2.yml

permissions:
  contents: read

jobs:
  r2-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Consultar disponibilidade do R2 sem ativar faturamento
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,re,sys,urllib.request,urllib.error
          account=os.environ.get("CLOUDFLARE_ACCOUNT_ID","")
          token=os.environ.get("CLOUDFLARE_API_TOKEN","")
          if not re.fullmatch(r"[a-fA-F0-9]{32}",account) or len(token)<20:
              sys.exit("FALHA: secrets de conta/token ausentes ou invalidos")
          url="https://api.cloudflare.com/client/v4/accounts/"+account+"/r2/buckets?name_contains=bl2-c1-teste-r2&per_page=20"
          req=urllib.request.Request(url,headers={
              "Authorization":"Bearer "+token,"Accept":"application/json","User-Agent":"BibliotecaLudica-C1-R2-ReadOnly/1.0"
          },method="GET")
          try:
              with urllib.request.urlopen(req,timeout=25) as response:
                  data=json.load(response)
          except urllib.error.HTTPError as e:
              print("R2: consulta de disponibilidade recusada. HTTP",e.code)
              try:
                  data=json.loads(e.read().decode())
                  codes=[str(x.get("code")) for x in data.get("errors",[]) if isinstance(x,dict)]
                  if codes:print("Codigos da API:",",".join(codes[:3]))
              except Exception:
                  pass
              print("Nenhum recurso foi criado e nenhuma configuracao de faturamento foi modificada.")
              if e.code in (401,403):
                  print("Verifique a permissao Workers R2 Storage Read ou Write; o token pode nao ter acesso.")
              sys.exit(2)
          except Exception as e:
              sys.exit("FALHA: conexao com API Cloudflare: "+type(e).__name__)
          if not data.get("success"):
              print("R2: API nao confirmou disponibilidade.")
              print("Codigos:",",".join(str(x.get("code")) for x in data.get("errors",[]) if isinstance(x,dict))[:200])
              sys.exit(2)
          result=data.get("result",{})
          if not isinstance(result,dict) or not isinstance(result.get("buckets"),list):
              sys.exit("R2: resposta da API inesperada. Nenhum recurso criado.")
          names=[x.get("name") for x in result["buckets"] if isinstance(x,dict)]
          print("R2: consulta autenticada de leitura respondeu com sucesso.")
          print("Bucket experimental bl2-c1-teste-r2 existente:", "SIM" if "bl2-c1-teste-r2" in names else "NAO")
          print("Acesso de listagem do R2 confirmado; disponibilidade de faturamento e custos nao inferidos.")
          print("Nenhum bucket, objeto ou subscricao R2 foi criado ou alterado.")
          PY
