name: BL2 editor keyboard hotfix (one-time)
on:
  push:
    branches:
      - fix/editor-keyboard-unexpected-error-20261016
    paths:
      - .github/workflows/bl2-editor-keyboard-hotfix.yml
permissions:
  contents: write
jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only editor keyboard/error handlers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          changes = [
              (
                  "                const key = evt.key.toLowerCase();",
                  "                if (typeof evt.key !== 'string') return;\n                const key = evt.key.toLowerCase();",
              ),
              (
                  "            window.addEventListener('keyup', (evt) => { this.keys.delete(evt.key.toLowerCase()); });",
                  "            window.addEventListener('keyup', (evt) => { if (typeof evt.key === 'string') this.keys.delete(evt.key.toLowerCase()); else this.keys.clear(); });",
              ),
              (
                  "            window.addEventListener('error', event => { this.note('UNEXPECTED_ERROR', String(event.message || event.error), 'error'); this.toast('Erro inesperado. Confira o painel F3.', true); });",
                  "            window.addEventListener('error', event => { const position = event.lineno > 0 ? \x60 [linha \x24{event.lineno}, coluna \x24{event.colno || 0}]\x60 : ''; this.note('UNEXPECTED_ERROR', String(event.message || event.error) + position, 'error'); this.toast('Erro inesperado. Confira o painel F3.', true); });",
              ),
          ]
          for old, new in changes:
              assert s.count(old) == 1, f'Expected one target occurrence: {old[:60]}'
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          start = s.index('/* Biblioteca Lúdica II — Protótipo navegável')
          end = s.index('</script>', start)
          Path('/tmp/bl2-app-script.js').write_text(s[start:end], encoding='utf-8')
          print('Patched exactly 3 event handling statements; embedded assets left unchanged.')
          PY
      - name: Verify JavaScript syntax
        run: node --check /tmp/bl2-app-script.js
      - name: Commit verified small change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "fix(editor): handle keyboard events missing key"
          git push
